# Answer page: the static page, and Kairyu's API on the same origin.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /v1/ {
        proxy_pass http://kairyu:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        # a verified answer arrives only after its checklist (and repairs)
        proxy_read_timeout 1800s;
        client_max_body_size 96m;
    }
}
