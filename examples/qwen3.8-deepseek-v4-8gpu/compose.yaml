name: kairyu-qwen38-deepseekv4-8gpu

x-qwen: &qwen
  image: ${QWEN_VLLM_IMAGE:-vllm/vllm-openai:v0.23.0@sha256:6d8429e38e3747723ca07ee1b17972e09bb9c51c4032b266f24fb1cc3b22ed8f}
  ipc: host
  environment:
    HF_HOME: /models/.cache
    HF_HUB_OFFLINE: "1"
    HF_HUB_DISABLE_TELEMETRY: "1"
    VLLM_NO_USAGE_STATS: "1"
    VLLM_USE_DEEP_GEMM: "0"
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    SAFETENSORS_FAST_GPU: "1"
    XDG_CACHE_HOME: /root/.cache
    TORCHINDUCTOR_CACHE_DIR: /root/.cache/torchinductor
    TRITON_CACHE_DIR: /root/.cache/triton
    TILELANG_CACHE_DIR: /root/.cache/tilelang
    TILELANG_TMP_DIR: /root/.cache/tilelang/tmp
  volumes: &qwen-volumes
    - type: bind
      source: ${QWEN_MODEL_STORAGE_PATH}
      target: /models
      read_only: true
  command: &qwen-command
    - /models/qwen3.8-27b-fp8
    - --served-model-name
    - qwen3.8-27b
    - --max-model-len
    - "262144"
    - --mm-processor-kwargs
    - '{"min_pixels":65536,"max_pixels":2097152}'
    - --limit-mm-per-prompt.image
    - "1"
    - --limit-mm-per-prompt.video
    - "0"
    - --dtype
    - bfloat16
    - --kv-cache-dtype
    - fp8
    - --mamba-cache-dtype
    - float16
    - --mamba-ssm-cache-dtype
    - float16
    - --mamba-cache-mode
    - align
    - --enable-prefix-caching
    - --enable-chunked-prefill
    - --max-num-batched-tokens
    - "32768"
    - --max-num-seqs
    - "32"
    - --gpu-memory-utilization
    - "0.95"
    - --attention-backend
    - FLASHINFER
    - --enable-flashinfer-autotune
    - --compilation-config
    - '{"cudagraph_mode":"PIECEWISE"}'
    - --generation-config
    - vllm
    - --chat-template
    - /etc/kairyu/qwen3.8-chat.jinja
    # No default chat-template kwargs: thinking L2 roles declare
    # reasoning_effort: high (the medium tier, DTO-D14) in auto-max.yaml,
    # which the example-local template turns into thinking mode with the
    # medium reasoning preamble per request.
    - --reasoning-parser
    - qwen3
    - --enable-auto-tool-choice
    - --tool-call-parser
    - qwen3_coder
    - --disable-uvicorn-access-log
    # MTP stays disabled until the deployed c16/c32 serving envelope is
    # measured without regression; see MEASUREMENTS.md (issue #509).
  healthcheck: &health
    test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2)']
    interval: 5s
    timeout: 3s
    retries: 1440
    start_period: 30s
  restart: unless-stopped

services:
  executor:
    build:
      context: ./sandbox
    image: ${EXECUTOR_IMAGE:-local/kairyu-executor:coding-v1}
    network_mode: none
    environment:
      RUNNER_SOCKET_PATH: /run/kairyu-executor/executor.sock
      # Sized for the c32 serving row's fan-out burst; runs are sub-second
      # CPU-bound pytest invocations, so 8 slots on 4 CPUs queue briefly
      # instead of degrading to `unavailable`.
      RUNNER_MAX_CONCURRENCY: "8"
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 4.0
    volumes:
      - executor-socket:/run/kairyu-executor
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
      - /run/exec:size=256m,uid=65534,noexec,nosuid,nodev
    healthcheck:
      test: [CMD, python3, -c, 'import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect("/run/kairyu-executor/executor.sock"); s.sendall(b"GET /healthz HTTP/1.0\r\nHost: executor\r\n\r\n"); assert b" 200 " in s.recv(64)']
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 5s
    restart: unless-stopped

  qwen-0:
    <<: *qwen
    cpuset: ${QWEN_0_CPUSET}
    volumes:
      - type: bind
        source: ${QWEN_MODEL_STORAGE_PATH}
        target: /models
        read_only: true
      - type: bind
        source: ${QWEN_CACHE_0_PATH}
        target: /root/.cache
      - ./qwen3.8-chat.jinja:/etc/kairyu/qwen3.8-chat.jinja:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  qwen-1:
    <<: *qwen
    cpuset: ${QWEN_1_CPUSET}
    volumes:
      - type: bind
        source: ${QWEN_MODEL_STORAGE_PATH}
        target: /models
        read_only: true
      - type: bind
        source: ${QWEN_CACHE_1_PATH}
        target: /root/.cache
      - ./qwen3.8-chat.jinja:/etc/kairyu/qwen3.8-chat.jinja:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

  qwen-2:
    <<: *qwen
    cpuset: ${QWEN_2_CPUSET}
    volumes:
      - type: bind
        source: ${QWEN_MODEL_STORAGE_PATH}
        target: /models
        read_only: true
      - type: bind
        source: ${QWEN_CACHE_2_PATH}
        target: /root/.cache
      - ./qwen3.8-chat.jinja:/etc/kairyu/qwen3.8-chat.jinja:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["2"]
              capabilities: [gpu]

  qwen-3:
    <<: *qwen
    cpuset: ${QWEN_3_CPUSET}
    volumes:
      - type: bind
        source: ${QWEN_MODEL_STORAGE_PATH}
        target: /models
        read_only: true
      - type: bind
        source: ${QWEN_CACHE_3_PATH}
        target: /root/.cache
      - ./qwen3.8-chat.jinja:/etc/kairyu/qwen3.8-chat.jinja:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["3"]
              capabilities: [gpu]

  deepseek:
    image: ${DEEPSEEK_VLLM_IMAGE:-local/vllm-openai:sm120-aa0d513027}
    ipc: host
    cpuset: ${DEEPSEEK_CPUSET}
    environment:
      HF_HOME: /models/.cache
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_NO_USAGE_STATS: "1"
      # MegaMoE currently rejects SM120 as SM100-only in the pinned build.
      VLLM_USE_DEEP_GEMM: "0"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      SAFETENSORS_FAST_GPU: "1"
      XDG_CACHE_HOME: /root/.cache
      TORCHINDUCTOR_CACHE_DIR: /root/.cache/torchinductor
      TRITON_CACHE_DIR: /root/.cache/triton
      TILELANG_CACHE_DIR: /root/.cache/tilelang
      TILELANG_TMP_DIR: /root/.cache/tilelang/tmp
    volumes:
      - deepseek-models:/models:ro
      - type: bind
        source: ${DEEPSEEK_CACHE_PATH}
        target: /root/.cache
      - ./deepseek-role-effort.jinja:/etc/kairyu/deepseek-role-effort.jinja:ro
    command:
      - /models/deepseek-v4-flash-0731
      - --served-model-name
      - deepseek-v4-flash-0731
      - --max-model-len
      - "1048576"
      - --trust-remote-code
      - --kv-cache-dtype
      - fp8
      - --block-size
      - "256"
      - --tensor-parallel-size
      - "4"
      - --enable-expert-parallel
      - --attention-config
      - '{"use_fp4_indexer_cache":false}'
      - --speculative-config
      - '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"greedy"}'
      - --compilation-config
      - '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}'
      - --tokenizer-mode
      - deepseek_v4
      - --reasoning-parser
      - deepseek_v4
      - --enable-auto-tool-choice
      - --tool-call-parser
      - deepseek_v4
      # Passthrough plus inherited-effort preamble injection for thinking
      # role calls (see deepseek-role-effort.jinja and auto-max.yaml).
      - --chat-template
      - /etc/kairyu/deepseek-role-effort.jinja
      - --enable-prefix-caching
      - --gpu-memory-utilization
      - "0.95"
      - --max-num-seqs
      - "32"
      - --max-num-batched-tokens
      - "16384"
      - --disable-uvicorn-access-log
    healthcheck: *health
    # Loopback-only L1 access lets the benchmark count the final L3 answer with
    # DeepSeek's exact tokenizer. ChatUI still has only the Kairyu L3 endpoint.
    ports:
      - 127.0.0.1:${DEEPSEEK_L1_PORT:-8005}:8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["4", "5", "6", "7"]
              capabilities: [gpu]
    restart: unless-stopped

  kairyu:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        KAIRYU_VISION: "1"
        KAIRYU_EMBEDDINGS: "1"
        KAIRYU_EMBEDDING_MODEL_REPOSITORY: Qdrant/all-MiniLM-L6-v2-onnx
        KAIRYU_EMBEDDING_MODEL_REVISION: 5f1b8cd78bc4fb444dd171e59b18f3a3af89a079
        KAIRYU_EMBEDDING_MODEL_SHA256: bbd7b466f6d58e646fdc2bd5fd67b2f5e93c0b687011bd4548c420f7bd46f0c5
        KAIRYU_EMBEDDING_PROVENANCE_SHA256: 57246a4990eb0f08755df06ba57c1fec161032bd588332435e89c7ece244639c
    image: ${KAIRYU_IMAGE:-local/kairyu:tiered-frontier-example}
    command: [/etc/kairyu/kairyu.yaml]
    environment:
      KAIRYU_CONTAINER_IMAGE_DIGEST: ${KAIRYU_IMAGE_ID:-local-build}
      # Codex remote-compaction tokens are AES-256-GCM sealed with this
      # secret; without a stable value a gateway restart invalidates every
      # outstanding token mid-session (Codex does not retry the 400).
      KAIRYU_RESPONSES_COMPACTION_SECRET: ${KAIRYU_RESPONSES_COMPACTION_SECRET:?set a random secret of at least 32 bytes (e.g. openssl rand -hex 32)}
    volumes:
      - type: bind
        source: ${QWEN_MODEL_STORAGE_PATH}
        target: /models/qwen
        read_only: true
      - deepseek-models:/models/deepseek:ro
      - ./kairyu.yaml:/etc/kairyu/kairyu.yaml:ro
      - ./auto-max.yaml:/etc/kairyu/auto-max.yaml:ro
      - ./router.json:/etc/kairyu/router.json:ro
      - ./deepseek-thinking.jinja:/etc/kairyu/deepseek-thinking.jinja:ro
      - ../deepseek-v4-flash-0731-8gpu/deepseek-v4-0731.jinja:/etc/kairyu/deepseek-v4-0731.jinja:ro
      - executor-socket:/run/kairyu-executor:ro
    depends_on:
      qwen-0: {condition: service_healthy}
      qwen-1: {condition: service_healthy}
      qwen-2: {condition: service_healthy}
      qwen-3: {condition: service_healthy}
      deepseek: {condition: service_healthy}
      # Startup-strict so a broken sandbox is caught at launch; a runtime
      # outage degrades executor stages instead of failing requests.
      executor: {condition: service_healthy}
    ports:
      - ${API_BIND_ADDRESS:-0.0.0.0}:${API_PORT:-8003}:8000
    healthcheck:
      test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=2)']
      interval: 5s
      timeout: 3s
      retries: 120
    restart: unless-stopped

  chat-ui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.11.0-slim@sha256:3698bd4e9628b7ae3768808721098616e669b4a05a6bceb2f5da2d84a3282a01}
    environment:
      OPENAI_API_BASE_URL: http://kairyu:8000/v1
      OPENAI_API_KEY: sk-local-kairyu
      OPENAI_API_CONFIGS: '{"0":{"model_ids":["kairyu-auto-max"]}}'
      DEFAULT_MODELS: kairyu-auto-max
      DEFAULT_MODEL_PARAMS: '{"max_tokens":65536,"stream_response":false}'
      ENABLE_PERSISTENT_CONFIG: "false"
      RESET_CONFIG_ON_START: "true"
      ENABLE_SIGNUP: "false"
      ENABLE_LOGIN_FORM: "false"
      WEBUI_AUTH: "false"
      WEBUI_URL: ${WEBUI_URL:-http://localhost:3000}
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:-}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:-}
      WEBUI_ADMIN_NAME: ${WEBUI_ADMIN_NAME:-Kairyu Admin}
      ENABLE_OLLAMA_API: "false"
      ENABLE_EVALUATION_ARENA_MODELS: "false"
      RAG_EMBEDDING_ENGINE: ""
    volumes:
      - type: bind
        source: ${WEBUI_STORAGE_PATH}
        target: /app/backend/data
    depends_on:
      kairyu: {condition: service_healthy}
    ports:
      - ${CHAT_UI_BIND_ADDRESS:-0.0.0.0}:${CHAT_UI_PORT:-3000}:8080
    restart: unless-stopped

volumes:
  executor-socket:
  deepseek-models:
    external: true
    name: ${DEEPSEEK_MODEL_VOLUME:-kairyu-models-deepseek-v4-flash-0731-8gpu}
