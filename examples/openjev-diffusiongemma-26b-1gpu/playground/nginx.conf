# System One playground: the static page, and Kairyu's API on the same origin.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /v1/ {
        proxy_pass http://kairyu:8000;
        proxy_http_version 1.1;
        # the chat column streams its thought and answer
        proxy_buffering off;
        proxy_read_timeout 1800s;
        # Kairyu bounds bodies itself (max_chat_body_bytes, systemone max_body_bytes)
        client_max_body_size 64m;
    }
}
