replicaCount: 1
image:
  repository: kairyu
  tag: dev
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
workloadRole: standalone
podLabels: {}
podAnnotations: {}
# Kept true for backwards compatibility with EndpointSlice discovery. Static
# pools should set this false, as the private-cloud PoC does.
automountServiceAccountToken: true
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
terminationGracePeriodSeconds: 30
strategyType: RollingUpdate
service:
  type: ClusterIP
  port: 8000
  labels: {}
  annotations: {}
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
probes:
  startup:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 90
  readiness:
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
gracefulDrain:
  enabled: false
  propagationSeconds: 10
  auth:
    secretName: ""
    secretKey: admin-key
resources: {}
nodeSelector: {}
runtimeClassName: ""
attentionBackend: ""
batchPostgres:
  enabled: false
  secretName: ""
  secretKey: dsn
  dsnEnvName: KAIRYU_BATCH_POSTGRES_DSN
tolerations: []
affinity: {}
modelStorage:
  enabled: false
  pvcName: ""
  hostPath: ""
  mountPath: /models
# DeploymentSpec YAML mounted at exactly /etc/kairyu/config.yaml (the
# Dockerfile CMD — m10a A11)
config: |
  engines:
    default:
      backend: mock
      options: {}
