# m11 D7: Open WebUI against the kairyu gateway (chat UI surface).
# Usage:
#   docker compose -f deploy/compose/docker-compose.webui.yaml up
#   docker compose -f deploy/compose/docker-compose.webui.yaml \
#     --profile browser-smoke run --rm browser
services:
  kairyu:
    build:
      context: ../..
      args:
        KAIRYU_EMBEDDINGS: "1"
        KAIRYU_EMBEDDING_MODEL_REPOSITORY: Qdrant/all-MiniLM-L6-v2-onnx
        KAIRYU_EMBEDDING_MODEL_REVISION: 5f1b8cd78bc4fb444dd171e59b18f3a3af89a079
        KAIRYU_EMBEDDING_MODEL_SHA256: bbd7b466f6d58e646fdc2bd5fd67b2f5e93c0b687011bd4548c420f7bd46f0c5
        KAIRYU_EMBEDDING_PROVENANCE_SHA256: 57246a4990eb0f08755df06ba57c1fec161032bd588332435e89c7ece244639c
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/etc/kairyu/config.yaml:ro
      - ./webui-orchestrator.yaml:/etc/kairyu/webui-orchestrator.yaml:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=2).read()
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s

  webui:
    image: >-
      ghcr.io/open-webui/open-webui:v0.11.0-slim@sha256:3698bd4e9628b7ae3768808721098616e669b4a05a6bceb2f5da2d84a3282a01
    ports:
      - "3000:8080"
    environment:
      OPENAI_API_BASE_URL: http://kairyu:8000/v1
      OPENAI_API_KEY: sk-local
      # The admin-visible "new version available" toast lands bottom-right at
      # an unpredictable moment after login and intercepts pointer events on
      # the model selector (flaky webui-e2e "AUTO UI chat" click timeouts).
      ENABLE_VERSION_UPDATE_CHECK: "false"
      RAG_EMBEDDING_ENGINE: openai
      RAG_EMBEDDING_MODEL: embed-small
      RAG_OPENAI_API_BASE_URL: http://kairyu:8000/v1
      RAG_OPENAI_API_KEY: sk-local
      RAG_EMBEDDING_BATCH_SIZE: "32"
      ENABLE_ASYNC_EMBEDDING: "true"
      RAG_EMBEDDING_CONCURRENT_REQUESTS: "2"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "false"
      RAG_TOP_K: "1"
      RAG_RELEVANCE_THRESHOLD: "0"
      RAG_FULL_CONTEXT: "false"
      BYPASS_EMBEDDING_AND_RETRIEVAL: "false"
      RAG_RERANKING_ENGINE: ""
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: "true"
      WEBUI_SECRET_KEY_FILE: /app/backend/data/.webui_secret_key
      DEFAULT_MODELS: default
    depends_on:
      kairyu:
        condition: service_healthy
    volumes:
      - webui-data:/app/backend/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=2).read()
      interval: 2s
      timeout: 3s
      retries: 90
      start_period: 10s

  browser:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.webui-browser
    image: kairyu-webui-browser:playwright-1.60.0
    profiles: [browser-smoke]
    depends_on:
      webui:
        condition: service_healthy
    environment:
      WEBUI_BASE_URL: http://webui:8080
      WEBUI_SMOKE_EMAIL: browser-smoke@kairyu.local
      WEBUI_SMOKE_PASSWORD: "KairyuBrowserSmoke-197!"
      WEBUI_SMOKE_NAME: Kairyu Browser Smoke
      EXPECTED_DIRECT_MODEL: default
      EXPECTED_AUTO_MODEL: kairyu-auto
    volumes:
      - ../../scripts/webui_browser_smoke.mjs:/work/webui_browser_smoke.mjs:ro
    command: node /work/webui_browser_smoke.mjs

volumes:
  webui-data:
