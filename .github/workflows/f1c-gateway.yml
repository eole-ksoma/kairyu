name: F1c three-gateway shared stores

on:
  pull_request:
    paths:
      - ".github/workflows/f1c-gateway.yml"
      - "scripts/install_kind_tools.sh"
      - "scripts/kind_gateway_gate.sh"
      - "scripts/kind_async_request_gate.sh"
      - "deploy/kind/f1c/**"
      - "deploy/kind/f1a/mock/**"
      - "verification/fleet/resilience/async_request_gateway_smoke.py"
      - "verification/fleet/resilience/fleet_gateway_bench.py"
      - "kairyu/**"
      - ".dockerignore"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    concurrency:
      group: f1c-three-gateway-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'manual' }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      F1C_RESULTS_DIR: bench/results/f1c-three-gateway-live
      ASYNC_REQUEST_RESULTS_DIR: bench/results/async-request-kind-live
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: >-
            ${{
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.sha ||
              github.sha
            }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install kind and kubectl
        env:
          KIND_VERSION: v0.32.0
          KUBECTL_VERSION: v1.36.3
        run: bash scripts/install_kind_tools.sh
      - name: Run the F1c and AsyncRequest Kubernetes integration tests
        shell: bash
        run: bash scripts/kind_async_request_gate.sh
      - name: Upload raw evidence and offline replay
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f1c-three-gateway-${{ github.run_id }}
          path: |
            bench/results/f1c-three-gateway-live
            bench/results/async-request-kind-live
          if-no-files-found: error
          retention-days: 30
